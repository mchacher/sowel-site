name: Deploy

# Publishes the site to GitHub Pages on every push to main, at https://sowel.org (the custom domain of
# this repository, set in its Pages settings; the DNS lives in Cloudflare, records in « DNS only »).
# The default Astro config already builds for sowel.org at the root, so `npm run validate` builds the
# exact artifact that is published. To serve the site under a sub-path again (for example the
# github.io address), set SITE_URL and SITE_BASE for the build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, the layout GitHub documents for Pages: the publication step looks up the artifact in the
  # workflow run, and when it ran in the same job as the upload it sometimes found none (« Found 0
  # artifact(s) »). A job of its own gives the upload time to settle.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
