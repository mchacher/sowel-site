<!doctype html>
<!-- The social card (1200 x 630) of the site. Open it with ?lang=en or ?lang=fr, screenshot at 1200 x 630,
     save as public/og/sowel-card-<lang>.png. The texts mirror the hero of src/content/<lang>.ts. -->
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: Inter;
    font-weight: 100 900;
    src: url("../../public/fonts/inter-latin-wght.woff2") format("woff2-variations");
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    width: 1200px;
    height: 630px;
    font-family: Inter, system-ui, sans-serif;
    color: #f3f7fa;
    overflow: hidden;
    background:
      radial-gradient(60% 55% at 50% 0%, rgba(43, 114, 153, 0.34), transparent 72%),
      linear-gradient(180deg, #060d12, #0e1f29);
    position: relative;
  }
  .glow {
    position: absolute;
    left: 50%;
    bottom: -260px;
    width: 900px;
    height: 520px;
    transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(242, 188, 110, 0.34), transparent 70%);
  }
  .brand {
    position: absolute;
    left: 72px;
    top: 64px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand img {
    width: 64px;
    height: 64px;
  }
  h1 {
    position: absolute;
    left: 72px;
    right: 72px;
    top: 172px;
    font-size: 92px;
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -0.045em;
  }
  h1 b {
    color: #7fb8d4;
    font-weight: 700;
  }
  p {
    position: absolute;
    left: 72px;
    right: 110px;
    top: 400px;
    font-size: 31px;
    line-height: 1.38;
    color: #a9c3d3;
  }
  .url {
    position: absolute;
    right: 72px;
    top: 76px;
    font-size: 28px;
    font-weight: 600;
    color: #7fb8d4;
  }
</style>
<div class="glow"></div>
<div class="brand"><img src="logo-night.svg" alt="" /> sowel</div>
<h1 id="h"></h1>
<p id="p"></p>
<div class="url">sowel.org</div>
<script>
  const t = {
    en: [
      "Sowel looks after <b>your home.</b>",
      "Tell Sowel what you need. It knows every room, runs itself, and keeps your data where it belongs: with you.",
    ],
    fr: [
      "Sowel prend soin de <b>votre maison.</b>",
      "Dites à Sowel ce dont vous avez besoin. Il connaît chaque pièce, tourne tout seul et garde vos données là où elles doivent rester : chez vous.",
    ],
  };
  const l = new URLSearchParams(location.search).get("lang") === "fr" ? "fr" : "en";
  document.getElementById("h").innerHTML = t[l][0];
  document.getElementById("p").textContent = t[l][1];
</script>
